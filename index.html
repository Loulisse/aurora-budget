<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Aurora</title>
<style>
/* RESET & BASE */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ivory:#FAFAF7;--ink:#1C1B18;--sage:#5C7A5F;--border:rgba(28,27,24,.1);
  --safe-t:env(safe-area-inset-top,44px);--safe-b:env(safe-area-inset-bottom,34px);
  --sans:'Plus Jakarta Sans',sans-serif;--serif:'Instrument Serif',serif;
}
html,body{height:100%;background:var(--ivory);color:var(--ink);font-family:var(--sans);overflow:hidden;touch-action:manipulation;}

/* STRUCTURE DES ÉCRANS */
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--ivory);opacity:0;pointer-events:none;
  transition:opacity .3s ease;z-index:1;
}
.screen.active{opacity:1;pointer-events:all;z-index:100 !important;}

/* AUTH CARD */
#screen-auth{justify-content:center;align-items:center;padding:24px;text-align:center;}
.auth-card{
  background:#fff;border-radius:28px;padding:24px;
  border:1.5px solid var(--border);width:100%;max-width:360px;
  box-shadow:0 10px 30px rgba(0,0,0,0.05);
  position:relative;z-index:101; /* Toujours au-dessus */
}
.auth-input{
  width:100%;padding:16px;border-radius:14px;
  border:1.5px solid var(--border);font-size:16px !important;
  margin-bottom:12px;outline:none;-webkit-appearance:none;
  background:#fff;display:block;
}
.auth-btn{
  width:100%;padding:18px;background:var(--ink);color:#fff;
  border:none;border-radius:100px;font-weight:700;font-size:1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;
}
.auth-btn:active{transform:scale(0.96);opacity:0.9;}

/* MAIN APP (Squelette pour le test) */
#screen-main{padding:20px;padding-top:var(--safe-t);}
.header{font-family:var(--serif);font-size:2rem;margin-bottom:20px;}
</style>
</head>
<body>

<div id="app">
  <div class="screen active" id="screen-auth">
    <div class="auth-card">
      <div style="font-size:3rem;margin-bottom:10px;">🌿</div>
      <h1 style="font-family:var(--serif);font-size:2.5rem;margin-bottom:5px;">Aurora</h1>
      <p style="color:#888;font-size:0.8rem;margin-bottom:25px;">VOTRE BUDGET, AVEC AMOUR</p>
      
      <input class="auth-input" id="auth-prenom" type="text" placeholder="Votre prénom..." autocomplete="off">
      <button class="auth-btn" id="btn-start">Accéder à Aurora →</button>
    </div>
  </div>

  <div class="screen" id="screen-main">
    <div class="header">Bonjour, <span id="user-name"></span></div>
    <div style="background:#fff;padding:20px;border-radius:20px;border:1px solid var(--border);">
        <p>L'application est débloquée 🎉</p>
        <button onclick="location.reload()" style="margin-top:20px;padding:10px;border-radius:10px;border:none;background:#eee;">Déconnexion</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// GESTION DU DÉMARRAGE
function handleAuth() {
    const prenom = $('auth-prenom').value.trim();
    
    if (prenom.length < 2) {
        alert("Merci d'entrer un prénom valide.");
        return;
    }

    // Sauvegarde
    localStorage.setItem('aurora_user', prenom);
    $('user-name').textContent = prenom;

    // Transition propre
    $('screen-auth').classList.remove('active');
    $('screen-main').classList.add('active');
}

// DOUBLE SÉCURITÉ POUR IPHONE (Click + Touch)
const startBtn = $('btn-start');

// 1. Pour les clics classiques et souris
startBtn.addEventListener('click', function(e) {
    e.preventDefault();
    handleAuth();
});

// 2. Pour le tactile iPhone (réagit avant le clic standard)
startBtn.addEventListener('touchstart', function(e) {
    // On ne fait rien ici pour laisser le clic se faire, 
    // mais cela force iOS à reconnaître l'élément comme interactif.
}, {passive: true});

// 3. Gérer la touche "Entrée" du clavier
$('auth-prenom').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        e.target.blur(); // Ferme le clavier (crucial sur iPhone)
        handleAuth();
    }
});

// AU CHARGEMENT : Vérifier si déjà connecté
window.onload = () => {
    const saved = localStorage.getItem('aurora_user');
    if (saved) {
        $('user-name').textContent = saved;
        $('screen-auth').classList.remove('active');
        $('screen-main').classList.add('active');
    }
};
</script>

</body>
</html>
