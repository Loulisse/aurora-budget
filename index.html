<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Aurora</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ivory:#FAFAF7;--ink:#1C1B18;--sage:#5C7A5F;--blue:#3B6B8C;--border:rgba(28,27,24,.1);
  --safe-t:env(safe-area-inset-top,44px);--safe-b:env(safe-area-inset-bottom,34px);
  --sans:'Plus Jakarta Sans',sans-serif;--serif:'Instrument Serif',serif;
}
html,body{height:100%;background:var(--ivory);color:var(--ink);font-family:var(--sans);overflow:hidden;touch-action:manipulation;}

/* STRUCTURE */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--ivory);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:1;}
.screen.active{opacity:1;pointer-events:all;z-index:100 !important;}

/* AUTH & SETUP */
#screen-auth{justify-content:center;align-items:center;padding:24px;text-align:center;}
.auth-card{background:#fff;border-radius:28px;padding:24px;border:1.5px solid var(--border);width:100%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,0.05);z-index:101;}
.auth-input{width:100%;padding:16px;border-radius:14px;border:1.5px solid var(--border);font-size:16px !important;margin-bottom:12px;outline:none;}
.auth-btn{width:100%;padding:18px;background:var(--ink);color:#fff;border:none;border-radius:100px;font-weight:700;cursor:pointer;}

/* SCOPE SELECTOR (L'élément clé) */
.scope-selector{display:flex;gap:8px;margin:15px 0;}
.scope-btn{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-size:0.8rem;font-weight:600;cursor:pointer;transition:0.2s;}
.scope-btn.active[data-scope="me"]{background:var(--blue);color:white;border-color:var(--blue);}
.scope-btn.active[data-scope="family"]{background:var(--sage);color:white;border-color:var(--sage);}

/* LISTING */
.scroll-area{flex:1;overflow-y:auto;padding:20px;padding-bottom:100px;}
.item-card{background:#fff;padding:15px;border-radius:18px;border:1.5px solid var(--border);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.tag{font-size:0.6rem;padding:2px 8px;border-radius:100px;text-transform:uppercase;font-weight:800;margin-top:4px;display:inline-block;}
.tag-me{background:#EBF2F8;color:var(--blue);}
.tag-family{background:#EBF0EB;color:var(--sage);}

.fab{position:fixed;bottom:30px;right:20px;width:60px;height:60px;border-radius:50%;background:var(--ink);color:white;border:none;font-size:1.5rem;box-shadow:0 10px 20px rgba(0,0,0,0.2);z-index:200;}
</style>
</head>
<body>

<div id="app">
  <div class="screen active" id="screen-auth">
    <div class="auth-card">
      <h1 style="font-family:var(--serif);font-size:2rem;margin-bottom:20px;">Configuration ✨</h1>
      <input class="auth-input" id="setup-name" type="text" placeholder="Ton prénom...">
      <input class="auth-input" id="setup-fcode" type="text" placeholder="Code Famille (Optionnel)">
      <button class="auth-btn" id="btn-save-setup">Commencer →</button>
    </div>
  </div>

  <div class="screen" id="screen-main">
    <div style="padding:20px;padding-top:var(--safe-t);border-bottom:1px solid var(--border);">
        <h2 style="font-family:var(--serif);">Mon Bilan</h2>
        <div id="display-fcode" style="font-size:0.7rem;color:var(--sage);font-weight:700;"></div>
    </div>
    
    <div class="scroll-area" id="main-list">
        </div>

    <button class="fab" id="btn-add">＋</button>
  </div>
</div>

<div class="screen" id="screen-add" style="background:rgba(0,0,0,0.5);justify-content:center;align-items:center;padding:20px;">
    <div class="auth-card">
        <h3 style="margin-bottom:15px;">Nouvelle entrée</h3>
        <input class="auth-input" id="in-label" type="text" placeholder="Libellé (ex: Loyer, Salaire...)">
        <input class="auth-input" id="in-amount" type="number" placeholder="Montant €">
        
        <p style="font-size:0.7rem;text-align:left;color:#888;">DESTINATION :</p>
        <div class="scope-selector">
            <button class="scope-btn active" data-scope="me">POUR MOI</button>
            <button class="scope-btn" data-scope="family">FAMILLE</button>
        </div>

        <button class="auth-btn" id="btn-confirm-add" style="background:var(--sage);">Enregistrer</button>
        <button onclick="$('screen-add').classList.remove('active')" style="background:none;border:none;margin-top:15px;color:#888;font-size:0.8rem;">Annuler</button>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentScope = "me";
let items = JSON.parse(localStorage.getItem('aurora_items') || "[]");

// NAVIGATION & SETUP
$('btn-save-setup').onclick = () => {
    const name = $('setup-name').value.trim();
    const fcode = $('setup-fcode').value.trim();
    if(!name) return alert("Prénom requis");
    
    localStorage.setItem('aurora_user', name);
    localStorage.setItem('aurora_fcode', fcode);
    initApp();
};

function initApp() {
    $('screen-auth').classList.remove('active');
    $('screen-main').classList.add('active');
    const fcode = localStorage.getItem('aurora_fcode');
    $('display-fcode').textContent = fcode ? "🏠 ESPACE PARTAGÉ : " + fcode.toUpperCase() : "👤 MODE SOLO";
    renderItems();
}

// LOGIQUE D'AJOUT
$('btn-add').onclick = () => $('screen-add').classList.add('active');

document.querySelectorAll('.scope-btn').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.scope-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentScope = btn.dataset.scope;
    };
});

$('btn-confirm-add').onclick = () => {
    const label = $('in-label').value;
    const amount = $('in-amount').value;
    if(!label || !amount) return;

    const newItem = {
        id: Date.now(),
        label,
        amount,
        scope: currentScope, // Ici on stocke si c'est "me" ou "family"
        date: new Date().toLocaleDateString()
    };

    items.push(newItem);
    localStorage.setItem('aurora_items', JSON.stringify(items));
    
    // Reset et fermeture
    $('in-label').value = ''; $('in-amount').value = '';
    $('screen-add').classList.remove('active');
    renderItems();
};

function renderItems() {
    $('main-list').innerHTML = items.length ? "" : "<p style='color:#888;text-align:center;'>Aucune donnée</p>";
    items.sort((a,b) => b.id - a.id).forEach(item => {
        const card = document.createElement('div');
        card.className = "item-card";
        card.innerHTML = `
            <div>
                <div style="font-weight:700;">${item.label}</div>
                <div class="tag ${item.scope === 'me' ? 'tag-me' : 'tag-family'}">
                    ${item.scope === 'me' ? 'Personnel' : 'Famille'}
                </div>
            </div>
            <div style="font-weight:800; font-size:1.1rem;">${item.amount} €</div>
        `;
        $('main-list').appendChild(card);
    });
}

// Check auto au chargement
window.onload = () => {
    if(localStorage.getItem('aurora_user')) initApp();
};
</script>

</body>
</html>
