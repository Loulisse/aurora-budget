<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <title>Aurora</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap"/>
    
    <style>
        /* RESET & BASE - Optimisé pour iPhone */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --ivory: #FAFAF7; --ink: #1C1B18; --sage: #5C7A5F;
            --border: rgba(28,27,24,0.1);
            --safe-t: env(safe-area-inset-top, 44px);
            --safe-b: env(safe-area-inset-bottom, 34px);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--ivory); 
            color: var(--ink); 
            height: 100dvh; 
            overflow: hidden;
            user-select: auto !important; /* Force la possibilité d'interagir */
        }

        /* SCREENS */
        .screen {
            position: absolute; inset: 0;
            display: none; flex-direction: column;
            background: var(--ivory);
            padding: 20px;
            padding-top: var(--safe-t);
            padding-bottom: var(--safe-b);
        }
        .screen.active { display: flex; }

        /* AUTH STYLE */
        #screen-auth { justify-content: center; align-items: center; text-align: center; }
        .auth-card {
            background: #fff; border-radius: 24px; padding: 24px;
            border: 1px solid var(--border); width: 100%; max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .auth-logo { font-family: 'Instrument Serif', serif; font-size: 3rem; margin-bottom: 10px; }
        
        /* INPUTS - Le secret pour iPhone est ici */
        input {
            width: 100%; padding: 16px; margin-bottom: 15px;
            border-radius: 12px; border: 1.5px solid var(--border);
            font-size: 16px !important; /* Minimum 16px pour éviter le zoom forcé iOS */
            appearance: none; -webkit-appearance: none;
            background: #fff;
        }
        
        button {
            width: 100%; padding: 16px; border-radius: 100px;
            border: none; background: var(--ink); color: #fff;
            font-weight: 700; font-size: 1rem; cursor: pointer;
        }

        /* MAIN APP UI (Simplifié pour l'exemple, à enrichir) */
        .header { padding: 20px 0; border-bottom: 1px solid var(--border); }
        .welcome { font-family: 'Instrument Serif', serif; font-size: 2rem; }
    </style>
</head>
<body>

    <div class="screen active" id="screen-auth">
        <div class="auth-logo">Aurora</div>
        <div class="auth-card">
            <h2 style="margin-bottom:10px;">Bienvenue ✨</h2>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 20px;">Entrez votre prénom pour commencer.</p>
            
            <input type="text" id="prenom-input" placeholder="Votre prénom..." autocomplete="off">
            <button id="btn-entrer">Continuer →</button>
        </div>
    </div>

    <div class="screen" id="screen-main">
        <div class="header">
            <p style="text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px;">Bonjour,</p>
            <div class="welcome" id="user-display">Utilisateur</div>
        </div>
        <div style="margin-top: 30px; text-align: center;">
            <p>Votre application est maintenant débloquée.</p>
            <button id="btn-back" style="margin-top: 20px; background: #eee; color: #000;">Déconnexion</button>
        </div>
    </div>

    <script>
        // Gestion de la navigation
        const screenAuth = document.getElementById('screen-auth');
        const screenMain = document.getElementById('screen-main');
        const prenomInput = document.getElementById('prenom-input');
        const btnEntrer = document.getElementById('btn-entrer');
        const userDisplay = document.getElementById('user-display');
        const btnBack = document.getElementById('btn-back');

        // Fonction pour passer à l'application
        function demarrerApp() {
            const nom = prenomInput.value.trim();
            
            if (nom.length < 2) {
                alert("Merci d'entrer un prénom valide.");
                return;
            }

            // Sauvegarde locale
            localStorage.setItem('aurora_user', nom);
            userDisplay.textContent = nom;

            // Changement d'écran
            screenAuth.classList.remove('active');
            screenMain.classList.add('active');
        }

        // Événements (Click + Touch pour iPhone)
        btnEntrer.addEventListener('click', demarrerApp);
        
        btnBack.addEventListener('click', () => {
            localStorage.removeItem('aurora_user');
            location.reload();
        });

        // Vérification au chargement
        window.onload = () => {
            const savedName = localStorage.getItem('aurora_user');
            if (savedName) {
                userDisplay.textContent = savedName;
                screenAuth.classList.remove('active');
                screenMain.classList.add('active');
            }
        };
        
        // Empêcher le zoom sur double tap (souvent gênant sur iPhone)
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
