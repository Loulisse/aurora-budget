<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Aurora</title>
<style>
/* 1. FIX CLAVIER IPHONE : Forcer 16px pour éviter le zoom/freeze */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ivory:#FAFAF7;--ink:#1C1B18;--sage:#5C7A5F;--border:rgba(28,27,24,.1);
  --safe-t:env(safe-area-inset-top,44px);--safe-b:env(safe-area-inset-bottom,34px);
  --sans:'Plus Jakarta Sans',sans-serif;--serif:'Instrument Serif',serif;
}
html,body{height:100%;background:var(--ivory);color:var(--ink);font-family:var(--sans);overflow:hidden;}
#app{display:flex;flex-direction:column;height:100dvh;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--ivory);opacity:0;pointer-events:none;transition:opacity .3s ease;}
.screen.active{opacity:1;pointer-events:all;}

/* AUTH */
#screen-auth{justify-content:center;align-items:center;padding:24px;text-align:center;}
.auth-card{background:#fff;border-radius:24px;padding:24px;border:1.5px solid var(--border);width:100%;max-width:360px;text-align:left;}
.auth-input{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--border);font-size:16px !important;margin-bottom:12px;outline:none;-webkit-appearance:none;}
.auth-btn{width:100%;padding:15px;background:var(--ink);color:#fff;border:none;border-radius:100px;font-weight:700;cursor:pointer;}

/* (Le reste de votre CSS original ici...) */
</style>
</head>
<body>
<div id="app">
  <div class="screen active" id="screen-auth">
    <div class="auth-card">
      <h2 style="font-family:var(--serif);margin-bottom:8px;">Bienvenue ✨</h2>
      <input class="auth-input" id="auth-prenom" type="text" placeholder="Votre prénom…" autocomplete="off"/>
      <button class="auth-btn" id="btn-start">Accéder à Aurora →</button>
    </div>
  </div>

  <div class="screen" id="screen-main">
    </div>
</div>

<script>
const $ = id => document.getElementById(id);

// 2. FIX NAVIGATION : Gestion propre du clic sur iPhone
window.addEventListener('load', () => {
    const savedUser = localStorage.getItem('aurora_user');
    if (savedUser) {
        showApp(savedUser);
    }

    $('btn-start').addEventListener('click', (e) => {
        e.preventDefault();
        const prenom = $('auth-prenom').value.trim();
        if (prenom) {
            localStorage.setItem('aurora_user', prenom);
            showApp(prenom);
        }
    });

    // Empêcher le freeze lors de l'appui sur "Entrée" du clavier iOS
    $('auth-prenom').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.target.blur(); // Ferme le clavier pour éviter le freeze
            $('btn-start').click();
        }
    });
});

function showApp(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $('screen-main').classList.add('active');
    // Relancer vos fonctions de rendu ici :
    // renderAll(); 
}

/* 3. RÉINTÉGRATION DE VOTRE LOGIQUE : 
   Copiez ici toutes vos fonctions originales (renderAll, updateBilan, etc.)
   en veillant à ce qu'elles ne soient appelées qu'APRÈS showApp().
*/
</script>
</body>
</html>
