<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <title>Aurora</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"/>

    <style>
        /* ============================================================
           SECTION 1 : VARIABLES & BASE (Design)
           ============================================================ */
        :root {
            --ivory: #FAFAF7; --ivory2: #F3F2ED; --ivory3: #EAE9E2;
            --ink: #1C1B18; --ink3: #8C8A82;
            --sage: #5C7A5F; --sage-m: #C5D4C6;
            --terra: #C4622D; --blue: #3B6B8C;
            --border: rgba(28,27,24,.1);
            --shadow-md: 0 4px 20px rgba(28,27,24,.1);
            --safe-t: env(safe-area-inset-top, 44px);
            --safe-b: env(safe-area-inset-bottom, 34px);
            --sans: 'Plus Jakarta Sans', sans-serif;
            --serif: 'Instrument Serif', serif;
        }

        *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; background: var(--ivory); color: var(--ink); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }

        /* STRUCTURE DES ECRANS (Correctif Tactile) */
        .screen {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            background: var(--ivory); opacity: 0; pointer-events: none;
            transition: opacity .3s ease; z-index: 1;
        }
        .screen.active { opacity: 1; pointer-events: all; z-index: 100 !important; }

        /* ============================================================
           SECTION 2 : STYLES VISUELS (Connexion & Interface)
           ============================================================ */
        #screen-auth { justify-content: center; align-items: center; padding: 24px; text-align: center; }
        
        .auth-blob {
            width: 120px; height: 120px; margin: 0 auto 20px;
            background: radial-gradient(circle at 40% 40%, var(--sage-m), var(--ivory2) 60%, var(--terra));
            border-radius: 60% 40% 70% 30%/50% 60% 40% 50%; animation: morph 8s ease-in-out infinite;
            display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
        }
        @keyframes morph { 0%,100%{border-radius:60% 40% 70% 30%/50% 60% 40% 50%} 33%{border-radius:40% 60% 30% 70%/60% 40% 60% 40%} 66%{border-radius:70% 30% 50% 50%/40% 70% 30% 60%} }

        .auth-card {
            background: #fff; border-radius: 28px; padding: 28px;
            border: 1.5px solid var(--border); box-shadow: var(--shadow-md); width: 100%; max-width: 380px;
        }
        .auth-logo { font-family: var(--serif); font-size: 2.5rem; margin-bottom: 20px; }
        .auth-input {
            width: 100%; padding: 16px; border-radius: 14px; border: 1.5px solid var(--border);
            font-size: 16px !important; margin-bottom: 12px; outline: none; background: #fff;
        }
        .auth-btn {
            width: 100%; padding: 18px; background: var(--ink); color: #fff; border: none;
            border-radius: 100px; font-weight: 700; font-size: 1rem; cursor: pointer;
        }
        .divider { display: flex; align-items: center; gap: 10px; margin: 20px 0; color: var(--ink3); font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        /* TOPBAR & NAV */
        .topbar { padding: calc(var(--safe-t) + 10px) 20px 10px; }
        .topbar-name { font-family: var(--serif); font-size: 2rem; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 20px; }
        
        .bottomnav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(250, 250, 247, .9); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border); padding: 10px 10px var(--safe-b);
            display: flex; justify-content: space-around; z-index: 50;
        }
        .nav-item { border: none; background: none; text-align: center; font-size: .6rem; color: var(--ink3); font-weight: 600; text-transform: uppercase; }
        .nav-icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--sage); }

        /* [DEBUT ZONE COPIER-COLLER CSS - FUTURES FONCTIONS] */
                /* Styles pour le Bilan */
        .card-balance {
            background: var(--ink); color: #fff; border-radius: 24px; padding: 24px;
            margin-bottom: 20px; box-shadow: var(--shadow-md);
        }
        .balance-label { font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; opacity: .7; }
        .balance-amount { font-family: var(--serif); font-size: 2.8rem; margin: 5px 0; }
        
        .split-balance { display: flex; gap: 15px; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .split-item { flex: 1; }
        .split-val { font-weight: 700; font-size: 1.1rem; display: block; }
        .split-lab { font-size: 0.6rem; text-transform: uppercase; opacity: 0.7; }

        /* Styles pour la liste d'activités */
        .section-title { font-family: var(--serif); font-size: 1.4rem; margin: 20px 0 12px; display: flex; justify-content: space-between; align-items: center; }
        .transaction-item {
            background: #fff; padding: 16px; border-radius: 18px; border: 1.5px solid var(--border);
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .item-info { display: flex; flex-direction: column; }
        .item-label { font-weight: 700; font-size: 0.95rem; }
        .item-tag { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; padding: 2px 8px; border-radius: 100px; margin-top: 4px; width: fit-content; }
        .tag-me { background: var(--blue-l); color: var(--blue); }
        .tag-family { background: var(--sage-l); color: var(--sage); }
        .item-amount { font-weight: 800; color: var(--sage); }

        /* Bouton Flottant Ajout */
        .fab {
            position: fixed; bottom: calc(85px + var(--safe-b)); right: 20px;
            width: 56px; height: 56px; border-radius: 50%; background: var(--ink);
            color: #fff; border: none; font-size: 1.5rem; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2); z-index: 90;
        }

        /* Sélecteur de portée (Moi/Famille) */
        .scope-picker { display: flex; gap: 10px; margin: 15px 0; }
        .scope-opt { 
            flex: 1; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border); 
            background: var(--ivory); font-weight: 700; font-size: 0.8rem; cursor: pointer;
        }
        .scope-opt.active { background: var(--ink); color: #fff; border-color: var(--ink); }
        /* C'est ici que vous ajouterez les styles pour les factures, le bocal d'épargne, etc. */
        /* [FIN ZONE COPIER-COLLER CSS] */

    </style>
</head>
<body>

    <div id="app">
        
        <div class="screen active" id="screen-auth">
            <div class="auth-blob">🌿</div>
            <div class="auth-logo">Aurora</div>
            
            <div class="auth-card">
                <input class="auth-input" id="auth-prenom" type="text" placeholder="Ton prénom..." autocomplete="off">
                <button class="auth-btn" id="btn-start">Accéder à mon espace →</button>

                <div class="divider">Partage Famille</div>
                <input class="auth-input" id="auth-fcode" type="text" placeholder="Code FAM-XXXXXX (Optionnel)">
                <button class="auth-btn" id="btn-join" style="background:var(--sage);">Rejoindre un espace</button>
            </div>
        </div>

        <div class="screen" id="screen-main">
            <div class="topbar">
                <div style="font-size:.7rem; color:var(--ink3); text-transform:uppercase; letter-spacing:1px;">Bonjour,</div>
                <div class="topbar-name" id="display-name">Utilisateur</div>
                <div id="display-status" style="font-size:.65rem; font-weight:800; color:var(--sage); margin-top:5px;"></div>
            </div>

            <div class="scroll-area" id="main-content">
                <div style="text-align:center; color:var(--ink3); margin-top:40px; padding:20px; border:1px dashed var(--border); border-radius:20px;">
                    <p>Votre structure est prête. ✨<br><br>Nous allons maintenant ajouter vos fonctions une par une.</p>
                </div>
                </div>

            <nav class="bottomnav">
                <button class="nav-item active"><span class="nav-icon">🏠</span>Bilan</button>
                <button class="nav-item"><span class="nav-icon">📋</span>Factures</button>
                <button class="nav-item"><span class="nav-icon">🔁</span>Fixes</button>
                <button class="nav-item"><span class="nav-icon">🫙</span>Épargne</button>
            </nav>
        </div>

        </div>

    <script>
        const $ = id => document.getElementById(id);

        // --- FONCTION DE DEMARRAGE ---
        function startApp(name, fcode) {
            if (!name) return alert("Veuillez entrer votre prénom.");
            
            // Sauvegarde locale
            localStorage.setItem('aurora_name', name);
            if(fcode) localStorage.setItem('aurora_fcode', fcode.toUpperCase());

            // Mise à jour interface
            $('display-name').textContent = name;
            $('display-status').textContent = fcode ? "🏠 ESPACE FAMILLE : " + fcode.toUpperCase() : "👤 MODE SOLO";
            
            // Changement d'écran
            $('screen-auth').classList.remove('active');
            $('screen-main').classList.add('active');
        }

        // --- ECOUTEURS ---
        $('btn-start').onclick = (e) => {
            e.preventDefault();
            startApp($('auth-prenom').value.trim(), null);
        };
        
        $('btn-join').onclick = (e) => {
            e.preventDefault();
            const name = $('auth-prenom').value.trim();
            const code = $('auth-fcode').value.trim();
            if(!code) return alert("Veuillez entrer un code famille.");
            startApp(name, code);
        };

        // Gestion du clavier (Touche Entrée)
        $('auth-prenom').onkeypress = (e) => { 
            if(e.key === 'Enter') { 
                e.target.blur(); 
                $('btn-start').click(); 
            } 
        };

        /* [DEBUT ZONE COPIER-COLLER JAVASCRIPT - LOGIQUE FONCTIONS] */
                        <div class="card-balance">
                    <span class="balance-label">Solde Total</span>
                    <div class="balance-amount" id="total-balance">0,00 €</div>
                    
                    <div class="split-balance">
                        <div class="split-item">
                            <span class="split-val" id="me-balance">0 €</span>
                            <span class="split-lab">Moi</span>
                        </div>
                        <div class="split-item">
                            <span class="split-val" id="fam-balance">0 €</span>
                            <span class="split-lab">Famille</span>
                        </div>
                    </div>
                </div>

                <div class="section-title">
                    <span>Revenus</span>
                </div>

                <div id="income-list">
                    </div>

                <button class="fab" id="btn-open-add">＋</button>
        <div class="screen" id="modal-add-income" style="background:rgba(0,0,0,0.4); justify-content:center; align-items:center; padding:20px;">
            <div class="auth-card" style="transform:none; opacity:1;">
                <h3 style="font-family:var(--serif); font-size:1.5rem; margin-bottom:15px;">Ajouter un revenu</h3>
                
                <input class="auth-input" id="in-label" type="text" placeholder="Source (ex: Salaire, Vente...)">
                <input class="auth-input" id="in-amount" type="number" placeholder="Montant en €">
                
                <p style="font-size:0.7rem; font-weight:700; color:var(--ink3); text-transform:uppercase;">C'est pour qui ?</p>
                <div class="scope-picker">
                    <div class="scope-opt active" id="opt-me" onclick="setScope('me')">MOI</div>
                    <div class="scope-opt" id="opt-fam" onclick="setScope('family')">FAMILLE</div>
                </div>

                <button class="auth-btn" id="btn-save-income">Enregistrer le revenu</button>
                <button class="auth-btn" onclick="$('modal-add-income').classList.remove('active')" style="background:none; color:var(--ink3); font-size:0.8rem; margin-top:5px;">Annuler</button>
            </div>
        </div>
        let currentScope = 'me';
        let transactions = JSON.parse(localStorage.getItem('aurora_tx') || '[]');

        // Changer la destination (Moi ou Famille)
        window.setScope = (scope) => {
            currentScope = scope;
            $('opt-me').classList.toggle('active', scope === 'me');
            $('opt-fam').classList.toggle('active', scope === 'family');
        };

        // Ouvrir/Fermer la modale
        $('btn-open-add').onclick = () => $('modal-add-income').classList.add('active');

        // Enregistrer une donnée
        $('btn-save-income').onclick = () => {
            const label = $('in-label').value.trim();
            const amount = parseFloat($('in-amount').value);

            if (!label || isNaN(amount)) return alert("Remplissez les champs correctement.");

            const tx = {
                id: Date.now(),
                label: label,
                amount: amount,
                scope: currentScope,
                date: new Date().toLocaleDateString('fr-FR')
            };

            transactions.push(tx);
            localStorage.setItem('aurora_tx', JSON.stringify(transactions));
            
            // Reset
            $('in-label').value = ''; $('in-amount').value = '';
            $('modal-add-income').classList.remove('active');
            
            renderData();
        };

        // Afficher les données et calculer le bilan
        function renderData() {
            const list = $('income-list');
            list.innerHTML = transactions.length === 0 ? '<p style="text-align:center; color:var(--ink3); font-size:0.8rem;">Aucun revenu enregistré</p>' : '';

            let total = 0;
            let totalMe = 0;
            let totalFam = 0;

            // Trier du plus récent au plus ancien
            transactions.sort((a, b) => b.id - a.id).forEach(t => {
                total += t.amount;
                if (t.scope === 'me') totalMe += t.amount;
                else totalFam += t.amount;

                const div = document.createElement('div');
                div.className = 'transaction-item';
                div.innerHTML = `
                    <div class="item-info">
                        <span class="item-label">${t.label}</span>
                        <span class="item-tag ${t.scope === 'me' ? 'tag-me' : 'tag-family'}">
                            ${t.scope === 'me' ? 'Personnel' : 'Famille'}
                        </div>
                    </div>
                    <div class="item-amount">+ ${t.amount.toLocaleString()} €</div>
                `;
                list.appendChild(div);
            });

            // Mettre à jour les chiffres du bilan
            $('total-balance').textContent = total.toLocaleString() + ' €';
            $('me-balance').textContent = totalMe.toLocaleString() + ' €';
            $('fam-balance').textContent = totalFam.toLocaleString() + ' €';
        }

        // On lance l'affichage au démarrage
        // (On rajoute l'appel à renderData dans votre fonction startApp existante)
        const originalStartApp = startApp;
        startApp = function(name, fcode) {
            originalStartApp(name, fcode);
            renderData();
        };

        /* Ici, nous ajouterons les calculs de factures, les sauvegardes de revenus, etc. */
        /* [FIN ZONE COPIER-COLLER JAVASCRIPT] */

        // --- VERIFICATION AUTOMATIQUE AU CHARGEMENT ---
        window.onload = () => {
            const savedName = localStorage.getItem('aurora_name');
            const savedCode = localStorage.getItem('aurora_fcode');
            if (savedName) {
                startApp(savedName, savedCode);
            }
        };
    </script>
</body>
</html>
