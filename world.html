<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Aurora World</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,34px);}
html,body{height:100%;overflow:hidden;background:#0a1628;font-family:-apple-system,sans-serif;}
#app{position:relative;width:100%;height:100dvh;}
canvas{position:absolute;inset:0;width:100%;height:100%;}

/* Top UI */
.topbar{position:absolute;top:0;left:0;right:0;padding:calc(var(–st)+2px) 14px 10px;display:flex;align-items:center;justify-content:space-between;z-index:50;pointer-events:none;}
.location-pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,10,.55);border:1px solid rgba(255,255,255,.15);border-radius:100px;padding:6px 14px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.loc-icon{font-size:1rem;}
.loc-name{font-size:.78rem;font-weight:800;color:#fff;letter-spacing:.06em;}
.back-btn{pointer-events:all;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 13px;border-radius:100px;font-size:.72rem;font-weight:700;cursor:pointer;}

/* Navigation lieux */
.nav-lieux{position:absolute;bottom:calc(var(–sb)+14px);left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:50;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(0,0,10,.6);border:1.5px solid rgba(255,255,255,.15);border-radius:18px;padding:10px 14px;cursor:pointer;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:all .25s;min-width:64px;}
.nav-btn:active{transform:scale(.92);}
.nav-btn.active{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);}
.nav-btn .nb-icon{font-size:1.3rem;}
.nav-btn .nb-label{font-size:.52rem;font-weight:700;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.08em;}

/* Mood indicator - juste emoji, pas de texte */
.mood-float{position:absolute;top:calc(var(–st)+54px);right:16px;font-size:1.8rem;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));z-index:50;pointer-events:none;animation:moodpulse 3s ease-in-out infinite;}
@keyframes moodpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* Loading */
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a1628;gap:14px;z-index:100;transition:opacity .5s;}
.loading h2{font-size:1.3rem;font-weight:800;color:#fff;letter-spacing:.12em;}
.ldots{display:flex;gap:7px;}
.ldot{width:9px;height:9px;border-radius:50%;background:#5C7A5F;animation:ldot .8s ease-in-out infinite;}
.ldot:nth-child(2){animation-delay:.14s;background:#C9943A;}
.ldot:nth-child(3){animation-delay:.28s;background:#3B6B8C;}
@keyframes ldot{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-8px);opacity:1}}
</style>

</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>
  <canvas id="world"></canvas>

  <div class="topbar">
    <div class="location-pill">
      <span class="loc-icon" id="loc-icon">🏠</span>
      <span class="loc-name" id="loc-name">MON QUARTIER</span>
    </div>
    <button class="back-btn" onclick="history.back()">← Aurora</button>
  </div>

  <div class="mood-float" id="mood-float">😊</div>

  <div class="nav-lieux">
    <button class="nav-btn active" id="nav-maison" onclick="setLieu('maison')">
      <span class="nb-icon">🏠</span><span class="nb-label">Maison</span>
    </button>
    <button class="nav-btn" id="nav-vacances" onclick="setLieu('vacances')">
      <span class="nb-icon">✈️</span><span class="nb-label">Vacances</span>
    </button>
    <button class="nav-btn" id="nav-garage" onclick="setLieu('garage')">
      <span class="nb-icon">🚗</span><span class="nb-label">Garage</span>
    </button>
  </div>

  <div class="loading" id="loading">
    <h2>AURORA WORLD</h2>
    <div class="ldots"><div class="ldot"></div><div class="ldot"></div><div class="ldot"></div></div>
  </div>
</div>
<script>
// ═══════════════════════════════════════════════════════
// AURORA WORLD v2 — 3 lieux, style isométrique
// ═══════════════════════════════════════════════════════

var bgC=document.getElementById(‘bg’),bgX=bgC.getContext(‘2d’);
var wC=document.getElementById(‘world’),ctx=wC.getContext(‘2d’);
var W,H;
function resize(){W=bgC.width=wC.width=window.innerWidth;H=bgC.height=wC.height=window.innerHeight;}
resize();window.addEventListener(‘resize’,resize);

// ── DONNÉES ──────────────────────────────────────────
var D={prenom:‘Vous’,sexe:’’,couleur:’#5C7A5F’,membres:[],bocaux:[],factures:[],charges:[],incomes:[]};
var SCORES={maison:0,transport:0,quotidien:0,vacances:0,famille:0,epargne:0,total:0};
var MOOD={global:2,enfants:2,meteo:2}; // 0=mauvais 1=neutre 2=bien 3=excellent
var LIEU=‘maison’; // maison | vacances | garage

function loadData(){
try{var r=localStorage.getItem(‘aurora_v8’);if(r)Object.assign(D,JSON.parse(r));}catch(e){}
calcScores();
buildChars();
buildObjects();
updateMoodUI();
}

function calcScores(){
// Score par classe de bocal (0-1)
var byClasse={};
D.bocaux.forEach(function(b){
var cl=b.classe||autoClasse(b.nom);
if(!byClasse[cl])byClasse[cl]={actuel:0,obj:0};
byClasse[cl].actuel+=(+b.actuel||0);
byClasse[cl].obj+=Math.max(1,+b.objectif||1);
});
[‘maison’,‘transport’,‘quotidien’,‘vacances’,‘famille’,‘epargne’].forEach(function(cl){
var c=byClasse[cl]||{actuel:0,obj:1};
SCORES[cl]=Math.min(1,c.actuel/c.obj);
});
// Score total finances
var rev=D.incomes.reduce(function(a,i){return a+(+i.amount||0);},0);
var dep=D.factures.filter(function(f){return !f.paid;}).reduce(function(a,f){return a+(+f.montant||0);},0);
var urg=D.factures.filter(function(f){return !f.paid&&f.prio===1;}).length;
SCORES.total=rev>0?Math.max(0,1-dep/rev):0;
// Mood global (finances)
if(urg>2||SCORES.total<0.1) MOOD.global=0;
else if(urg>0||SCORES.total<0.4) MOOD.global=1;
else if(SCORES.total>0.7) MOOD.global=3;
else MOOD.global=2;
// Mood enfants (classe famille)
MOOD.enfants=Math.floor(SCORES.famille*4);
MOOD.enfants=Math.min(3,Math.max(0,MOOD.enfants));
// Météo (dépenses quotidiennes)
MOOD.meteo=Math.floor(SCORES.quotidien*4);
MOOD.meteo=Math.min(3,Math.max(0,MOOD.meteo));
}

function autoClasse(nom){
var n=(nom||’’).toLowerCase();
if(/maison|logement|loyer|appart|immob|proprio|toit/.test(n))return’maison’;
if(/voiture|auto|moto|velo|transport|garage|permis/.test(n))return’transport’;
if(/vetement|habit|mode|sac|chaussure|shopping|quotidien/.test(n))return’quotidien’;
if(/resto|sortie|loisir|cinema|concert|spectacle/.test(n))return’quotidien’;
if(/vacance|voyage|trip|plage|hotel|airbnb/.test(n))return’vacances’;
if(/enfant|bebe|kid|jouet|ecole|etude|famille/.test(n))return’famille’;
return’epargne’;
}

function updateMoodUI(){
var moodEmojis=[‘😰’,‘😐’,‘😊’,‘🤩’];
document.getElementById(‘mood-float’).textContent=moodEmojis[MOOD.global];
}

// ── NAVIGATION LIEUX ─────────────────────────────────
var lieux={
maison:{icon:‘🏠’,name:‘MON QUARTIER’},
vacances:{icon:‘✈️’,name:‘VACANCES’},
garage:{icon:‘🚗’,name:‘MON GARAGE’}
};
function setLieu(l){
LIEU=l;
document.getElementById(‘loc-icon’).textContent=lieux[l].icon;
document.getElementById(‘loc-name’).textContent=lieux[l].name;
[‘maison’,‘vacances’,‘garage’].forEach(function(x){
document.getElementById(‘nav-’+x).classList.toggle(‘active’,x===l);
});
buildObjects();
}

// ── ISO ───────────────────────────────────────────────
var TW=56,TH=28;
function iso(x,y,z){
return{x:(x-y)*TW/2+W/2, y:(x+y)*TH/2-z*26+H*0.44};
}

// ── PERSONNAGES ───────────────────────────────────────
var chars=[];
function buildChars(){
chars=[];
chars.push({id:‘me’,name:D.prenom||‘Vous’,sexe:D.sexe||‘F’,col:D.couleur||’#5C7A5F’,
x:3.8,y:4.2,tx:3.8,ty:4.2,fx:1,st:‘idle’,fr:0,ft:0,it:3000,bt:6000,
mood:MOOD.global,isKid:false,isMain:true,scale:0.72});
(D.membres||[]).forEach(function(m,i){
var age=m.dob?Math.floor((Date.now()-new Date(m.dob))/(365.25*864e5)):25;
var isKid=age<16;
var a=(i/(Math.max(1,D.membres.length)))*Math.PI*2;
chars.push({id:m.id,name:m.prenom,sexe:m.sexe||‘F’,col:m.couleur||’#C4622D’,
x:4+Math.cos(a)*1.8,y:4+Math.sin(a)*1.8,
tx:4+Math.cos(a)*1.8,ty:4+Math.sin(a)*1.8,
fx:1,st:‘idle’,fr:0,ft:0,it:4000+i*1000,bt:8000+i*3000,
mood:isKid?MOOD.enfants:MOOD.global,isKid:isKid,isMain:false,
scale:isKid?0.52:0.68,age:age});
});
}

// ── OBJETS ────────────────────────────────────────────
var objects=[];
var clouds=[];
for(var ci=0;ci<7;ci++)clouds.push({x:Math.random(),y:0.04+Math.random()*0.18,w:50+Math.random()*90,sp:0.00003+Math.random()*0.00006,a:0.25+Math.random()*0.4});

function buildObjects(){
objects=[];
if(LIEU===‘maison’) buildMaison();
else if(LIEU===‘vacances’) buildVacances();
else buildGarage();
}

function buildMaison(){
// Terrain 8x8 isométrique
var hLv=Math.floor(SCORES.maison*5); // 0-4
// Sol
for(var gx=0;gx<8;gx++)for(var gy=0;gy<8;gy++){
var t=‘grass’;
if(gx===4&&gy===4)t=‘center’;
else if((gx+gy)%6===0)t=‘path’;
else if(gx===1&&gy===1&&hLv>=2)t=‘garden’;
else if(gx===7&&gy===7&&hLv>=3)t=‘pool’;
objects.push({t:‘tile’,x:gx,y:gy,z:0,tile:t});
}
// Maison principale
objects.push({t:‘house’,x:4,y:4,z:0,lv:hLv,anim:0});
// Voisins / quartier selon niveau
if(hLv>=1)objects.push({t:‘house_small’,x:1,y:2,z:0,lv:Math.max(0,hLv-2),anim:0.5});
if(hLv>=2)objects.push({t:‘house_small’,x:7,y:3,z:0,lv:Math.max(0,hLv-1),anim:1});
if(hLv>=3)objects.push({t:‘house_small’,x:2,y:7,z:0,lv:Math.max(0,hLv-1),anim:1.5});
if(hLv>=4)objects.push({t:‘house_small’,x:6,y:7,z:0,lv:hLv-1,anim:2});
// Arbres
[[0,4],[4,0],[8,4],[4,8],[0,0],[8,0],[0,8],[8,8]].forEach(function(s,i){
objects.push({t:‘tree’,x:s[0],y:s[1],z:0,g:0.5+SCORES.maison*0.5,sw:i*0.7});
});
// Route
for(var rp=0;rp<8;rp++)objects.push({t:‘road’,x:rp,y:4.5,z:-0.05});
// Lampadaires si niveau >=2
if(hLv>=2){objects.push({t:‘lamp’,x:2,y:4.5,z:0});objects.push({t:‘lamp’,x:6,y:4.5,z:0});}
}

function buildVacances(){
var vLv=Math.floor(SCORES.vacances*4); // 0=camping pluie, 1=camping soleil, 2=bungalow plage, 3=resort luxe
// Terrain : plage/camping
for(var gx2=0;gx2<8;gx2++)for(var gy2=0;gy2<8;gy2++){
var t2=‘sand’;
if(gy2>=5)t2=vLv>=2?‘sea’:‘mud’;
else if(gx2>=6)t2=‘rock’;
else if(vLv===0&&gy2<3)t2=‘mud’;
objects.push({t:‘tile’,x:gx2,y:gy2,z:0,tile:t2});
}
// Hébergement selon niveau
if(vLv===0)objects.push({t:‘tent_camping’,x:4,y:3,z:0,anim:0});
else if(vLv===1)objects.push({t:‘tent’,x:4,y:3,z:0,anim:0});
else if(vLv===2)objects.push({t:‘bungalow’,x:4,y:3,z:0,anim:0});
else objects.push({t:‘resort’,x:4,y:3,z:0,anim:0});
// Cocotiers selon niveau
if(vLv>=1){objects.push({t:‘palm’,x:2,y:4,z:0});objects.push({t:‘palm’,x:6,y:4,z:0});}
if(vLv>=2){objects.push({t:‘palm’,x:1,y:6,z:0});objects.push({t:‘palm’,x:7,y:5,z:0});}
// Table de camping / parasol
if(vLv===0)objects.push({t:‘camp_table’,x:4,y:4.5,z:0});
else if(vLv>=2)objects.push({t:‘parasol’,x:3,y:5,z:0});
if(vLv>=3){objects.push({t:‘parasol’,x:5,y:5,z:0});objects.push({t:‘boat’,x:6.5,y:6,z:0});}
// Pluie si niveau 0 (géré dans le draw background)
}

function buildGarage(){
var gLv=Math.floor(SCORES.transport*5); // 0-4
// Sol garage
for(var gx3=0;gx3<8;gx3++)for(var gy3=0;gy3<8;gy3++){
var t3=‘concrete’;
if(gy3<2)t3=‘outside’;
else if(gx3===0||gx3===7)t3=‘wall’;
objects.push({t:‘tile’,x:gx3,y:gy3,z:0,tile:t3});
}
// Véhicule principal selon niveau
var cars=[‘none’,‘old_car’,‘sedan’,‘sport’,‘super’];
if(gLv>0)objects.push({t:cars[gLv],x:4,y:5,z:0,anim:0});
// Outils, établi
objects.push({t:‘workbench’,x:1.5,y:6.5,z:0});
objects.push({t:‘toolbox’,x:6.5,y:6.5,z:0});
if(gLv>=2)objects.push({t:‘tools_wall’,x:1,y:4,z:0});
if(gLv>=3)objects.push({t:‘moto’,x:2,y:5,z:0});
if(gLv>=4)objects.push({t:‘sport_moto’,x:6,y:5,z:0});
// Entrée garage
objects.push({t:‘garage_door’,x:4,y:2,z:0,open:gLv>0});
}

// ── PARTICULES ────────────────────────────────────────
var particles=[],rainDrops=[];
function spawnConfetti(px,py){
var cols=[’#5C7A5F’,’#C9943A’,’#3B6B8C’,’#C4622D’,’#fff’,’#ffd700’];
for(var i=0;i<8;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*3,vy:-(Math.random()*2+1),life:1,size:3+Math.random()*5,col:cols[i%6],rot:Math.random()*6,rv:(Math.random()-.5)*0.2});
}
function updateRain(){
rainDrops=rainDrops.filter(function(r){r.y+=4;r.x+=0.5;return r.y<H;});
if(LIEU===‘vacances’&&SCORES.vacances<0.25&&Math.random()<0.4)
rainDrops.push({x:Math.random()*W,y:-10,len:8+Math.random()*10});
}

// ── UPDATE ────────────────────────────────────────────
var T=0;
function update(dt){
T+=dt;
clouds.forEach(function(c){c.x+=c.sp;if(c.x>1.3)c.x=-0.3;});
updateRain();
objects.forEach(function(o){if(o.anim!==undefined)o.anim+=dt*0.001;});
chars.forEach(function(c){
c.it-=dt;
if(c.it<=0){
var r=1.2+Math.random()*1.8,a=Math.random()*Math.PI*2;
c.tx=Math.max(0.5,Math.min(7.5,4+Math.cos(a)*r));
c.ty=Math.max(0.5,Math.min(7.5,4+Math.sin(a)*r));
c.it=2500+Math.random()*4000;
c.st=c.mood===3?‘run’:c.mood===0?‘walk’:‘walk’;
}
var dx=c.tx-c.x,dy=c.ty-c.y,dist=Math.sqrt(dx*dx+dy*dy);
var sp=(c.st===‘run’?0.0014:0.0008)*dt;
if(dist>0.08){c.x+=dx/dist*sp;c.y+=dy/dist*sp;c.fx=dx>0?1:-1;c.st=dist<0.2?‘idle’:c.st;}
else{c.st=c.mood===3&&Math.random()<0.002*dt?‘dance’:‘idle’;}
c.ft+=dt;if(c.ft>160){c.fr=(c.fr+1)%8;c.ft=0;}
c.bt-=dt;
if(c.bt<=0&&MOOD.global===3){
var p2=iso(c.x,c.y,c.z||0);spawnConfetti(p2.x,p2.y-50);c.bt=8000+Math.random()*10000;
}
});
particles=particles.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=0.04;p.life-=0.01;p.rot+=p.rv;return p.life>0;});
}

// ── DRAW BACKGROUND ───────────────────────────────────
function drawBG(){
bgX.clearRect(0,0,W,H);
// Ciel selon météo ET lieu
var skies={
0:[[’#1a0a2e’,’#2d1060’],[’#0a0518’,’#1a0a3a’]], // orage
1:[[’#1a2a4a’,’#2d5986’],[’#0f1a30’,’#1a3a5c’]], // nuageux
2:[[’#0f3460’,’#1a6a9c’],[’#87ceeb’,’#b8d4f0’]], // beau
3:[[’#1a7aa8’,’#87ceeb’],[’#ffecd2’,’#ffab40’]]  // magnifique
};
var sk=skies[MOOD.meteo]||skies[2];
var g=bgX.createLinearGradient(0,0,0,H*.68);
g.addColorStop(0,sk[0][0]);g.addColorStop(0.5,sk[0][1]);g.addColorStop(1,sk[1][1]||sk[0][1]);
bgX.fillStyle=g;bgX.fillRect(0,0,W,H);

// Étoiles si mauvaise météo/nuit
if(MOOD.meteo<2){
bgX.fillStyle=‘rgba(255,255,255,0.5)’;
for(var si=0;si<60;si++){
var sx=(si*137.5)%1*W,sy=(si*73.3)%0.45*H;
var pulse=0.2+Math.sin(T*0.002+si)*0.3;
bgX.globalAlpha=pulse;bgX.beginPath();bgX.arc(sx,sy,0.7+Math.sin(si)*.4,0,Math.PI*2);bgX.fill();
}
bgX.globalAlpha=1;
// Lune
bgX.fillStyle=‘rgba(230,225,200,0.85)’;bgX.beginPath();bgX.arc(W*.78,H*.1,18,0,Math.PI*2);bgX.fill();
bgX.fillStyle=sk[0][0];bgX.beginPath();bgX.arc(W*.78+6,H*.1-2,14,0,Math.PI*2);bgX.fill();
} else {
// Soleil
var sx2=W*.72,sy2=H*.1;
var sg=bgX.createRadialGradient(sx2,sy2,0,sx2,sy2,50);
sg.addColorStop(0,‘rgba(255,230,80,1)’);sg.addColorStop(0.45,‘rgba(255,170,20,.75)’);sg.addColorStop(1,‘rgba(255,100,0,0)’);
bgX.fillStyle=sg;bgX.beginPath();bgX.arc(sx2,sy2,50,0,Math.PI*2);bgX.fill();
for(var ri=0;ri<8;ri++){
var ra=ri*Math.PI/4+T*0.00015;
bgX.strokeStyle=‘rgba(255,200,50,0.12)’;bgX.lineWidth=16;
bgX.beginPath();bgX.moveTo(sx2+Math.cos(ra)*28,sy2+Math.sin(ra)*28);bgX.lineTo(sx2+Math.cos(ra)*85,sy2+Math.sin(ra)*85);bgX.stroke();
}
}
// Nuages
clouds.forEach(function(c){
bgX.fillStyle=MOOD.meteo>=2?‘rgba(255,255,255,.6)’:‘rgba(100,100,140,.35)’;
var cx=c.x*W,cy=c.y*H,cw=c.w;
bgX.beginPath();bgX.ellipse(cx,cy,cw*.5,cw*.16,0,0,Math.PI*2);
bgX.ellipse(cx-cw*.17,cy-cw*.09,cw*.26,cw*.15,0,0,Math.PI*2);
bgX.ellipse(cx+cw*.17,cy-cw*.07,cw*.21,cw*.13,0,0,Math.PI*2);
bgX.fill();
});
// Montagnes
var mc=MOOD.meteo>=2?‘rgba(40,90,60,.45)’:‘rgba(15,35,60,.55)’;
bgX.fillStyle=mc;
bgX.beginPath();bgX.moveTo(0,H*.52);
var mpts=[[.04,.3],[.14,.22],[.27,.32],[.4,.18],[.54,.28],[.67,.2],[.8,.3],[.9,.22],[1,.32],[1,.52]];
mpts.forEach(function(m){bgX.lineTo(m[0]*W,m[1]*H);});
bgX.closePath();bgX.fill();
// Neige sommets
bgX.fillStyle=‘rgba(255,255,255,.5)’;
[[.14,.22],[.4,.18],[.67,.2],[.9,.22]].forEach(function(m){
bgX.beginPath();bgX.arc(m[0]*W,m[1]*H,7,0,Math.PI*2);bgX.fill();
});
// Pluie
if(LIEU===‘vacances’&&SCORES.vacances<0.25){
bgX.strokeStyle=‘rgba(150,180,255,.45)’;bgX.lineWidth=1;

function draw(){

if(lv<=1){ctx.fillRect(-14,-16,12,11);ctx.fillRect(2,-16,12,11);}
else{ctx.beginPath();ctx.moveTo(-16,-18);ctx.lineTo(-8,-30);ctx.lineTo(8,-30);ctx.lineTo(16,-18);ctx.closePath();ctx.fill();}
// Roues
ctx.fillStyle=’#222’;[[-22,8],[22,8]].forEach(function(w){ctx.beginPath();ctx.ellipse(w[0],w[1]+2,9,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=’#555’;ctx.beginPath();ctx.ellipse(w[0],w[1]+1,5,3,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=’#222’;});
// Phares
ctx.fillStyle=‘rgba(255,240,150,.9)’;ctx.beginPath();ctx.ellipse(28,-4,5,3,0,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.ellipse(-28,-4,5,3,0,0,Math.PI*2);ctx.fill();
if(lv===3){ctx.fillStyle=‘rgba(255,200,0,.6)’;[0,1,2].forEach(function(sp){var sa=sp*Math.PI*2/3+T*.002;ctx.beginPath();ctx.arc(22+Math.cos(sa)*12,4+Math.sin(sa)*4,2,0,Math.PI*2);ctx.fill();});}
}

function drawMoto(o,isSport){
ctx.fillStyle=isSport?’#e74c3c’:’#555’;
ctx.beginPath();ctx.ellipse(0,-5,18,10,0.2,0,Math.PI*2);ctx.fill();
ctx.fillStyle=’#222’;
ctx.beginPath();ctx.ellipse(-14,6,8,4,0,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.ellipse(14,6,8,4,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle=isSport?‘rgba(255,100,0,.8)’:‘rgba(255,200,50,.8)’;
ctx.beginPath();ctx.ellipse(18,2,5,3,0,0,Math.PI*2);ctx.fill();
if(isSport){ctx.fillStyle=‘rgba(255,50,0,.5)’;ctx.beginPath();ctx.moveTo(-18,-4);ctx.lineTo(-32,2);ctx.lineTo(-28,8);ctx.lineTo(-18,4);ctx.closePath();ctx.fill();}
}

// ── PERSONNAGE ────────────────────────────────────────
function drawChar(c){
var p=iso(c.x,c.y,0);
ctx.save();ctx.translate(p.x,p.y);
var sc=c.scale||0.7;ctx.scale(sc,sc);
if(c.fx<0)ctx.scale(-1,1);
var bob=c.st===‘walk’||c.st===‘run’?Math.sin(T*.012+(c.x+c.y))*3.5:c.st===‘dance’?Math.sin(T*.016)*5:0;
var leg=c.st===‘walk’||c.st===‘run’?Math.sin(T*.012+(c.x+c.y)):c.st===‘dance’?Math.sin(T*.016)*.8:0;
var arm=c.st===‘dance’?Math.sin(T*.012)*28:c.st===‘walk’?Math.sin(T*.012+(c.x+c.y))*10:0;
var sp=c.st===‘run’?1.5:1;
leg*=sp;arm*=sp;
var col=c.col||’#5C7A5F’;
var skin=c.sexe===‘M’?’#F5CBA7’:’#FDBCB4’;
var moodE=[0,1,2,3][c.mood||0];

// Ombre
ctx.fillStyle=‘rgba(0,0,0,0.15)’;ctx.beginPath();ctx.ellipse(0,4,13,4,0,0,Math.PI*2);ctx.fill();

// Jambes
ctx.lineWidth=c.isKid?6:7;ctx.lineCap=‘round’;ctx.strokeStyle=’#2C3E50’;
var lr=leg*14*Math.PI/180;
ctx.beginPath();ctx.moveTo(-5,bob-8);ctx.lineTo(-5+Math.sin(lr)*12,bob+16);ctx.stroke();
ctx.beginPath();ctx.moveTo(5,bob-8);ctx.lineTo(5-Math.sin(lr)*12,bob+16);ctx.stroke();
ctx.fillStyle=’#1a252f’;
ctx.beginPath();ctx.ellipse(-5+Math.sin(lr)*12,bob+18,7,4,0.2,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.ellipse(5-Math.sin(lr)*12,bob+18,7,4,-0.2,0,Math.PI*2);ctx.fill();

// Corps ovale
ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,bob-22,c.isKid?13:16,c.isKid?17:20,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle=‘rgba(255,255,255,.18)’;ctx.beginPath();ctx.ellipse(-4,bob-30,c.isKid?6:8,c.isKid?8:10,-0.3,0,Math.PI*2);ctx.fill();

// Bras
var ar=arm*Math.PI/180;
ctx.lineWidth=c.isKid?7:8;ctx.strokeStyle=col;
ctx.beginPath();ctx.moveTo(-c.isKid?-12:-15,bob-28);ctx.lineTo(-(c.isKid?12:15)+Math.sin(ar)*15,bob-28+Math.abs(Math.cos(ar))*13);ctx.stroke();
ctx.beginPath();ctx.moveTo(c.isKid?12:15,bob-28);ctx.lineTo((c.isKid?12:15)-Math.sin(ar)*15,bob-28+Math.abs(Math.cos(ar))*13);ctx.stroke();
ctx.fillStyle=skin;
ctx.beginPath();ctx.arc(-(c.isKid?12:15)+Math.sin(ar)*15,bob-28+Math.abs(Math.cos(ar))*13,c.isKid?4:5,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc((c.isKid?12:15)-Math.sin(ar)*15,bob-28+Math.abs(Math.cos(ar))*13,c.isKid?4:5,0,Math.PI*2);ctx.fill();

// Cou
ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(0,bob-38,c.isKid?5:6,4,0,0,Math.PI*2);ctx.fill();

// Tête
var hr=c.isKid?15:18;
ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,bob-(c.isKid?50:54),hr,0,Math.PI*2);ctx.fill();
ctx.fillStyle=‘rgba(0,0,0,0.05)’;ctx.beginPath();ctx.arc(4,bob-(c.isKid?47:51),hr*.8,0,Math.PI*2);ctx.fill();
ctx.fillStyle=‘rgba(255,255,255,.2)’;ctx.beginPath();ctx.arc(-5,bob-(c.isKid?57:61),hr*.35,0,Math.PI*2);ctx.fill();

// Cheveux
var hairC=c.sexe===‘M’?’#3D2B1F’:’#6B3A2F’;
var hy=bob-(c.isKid?62:66);
if(c.sexe===‘F’){
ctx.fillStyle=hairC;ctx.beginPath();ctx.arc(0,hy,hr+2,Math.PI,0);ctx.fill();
ctx.beginPath();ctx.arc(-hr-1,hy+3,5,Math.PI*1.2,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(hr+1,hy+3,5,-Math.PI*.2,Math.PI);ctx.fill();
if(!c.isKid){ctx.lineWidth=5;ctx.strokeStyle=hairC;ctx.lineCap=‘round’;ctx.beginPath();ctx.moveTo(-(hr+2),hy+4);ctx.quadraticCurveTo(-(hr+6),hy+14,-(hr+4),hy+24);ctx.stroke();ctx.beginPath();ctx.moveTo(hr+2,hy+4);ctx.quadraticCurveTo(hr+6,hy+14,hr+4,hy+24);ctx.stroke();}
ctx.fillStyle=’#FF6B9D’;ctx.beginPath();ctx.arc(0,hy-hr-1,4,0,Math.PI*2);ctx.fill();
} else if(c.sexe===‘M’){
ctx.fillStyle=hairC;ctx.beginPath();ctx.arc(0,hy,hr+1,Math.PI*.8,Math.PI*.2);ctx.fill();
ctx.beginPath();ctx.moveTo(-3,hy-hr-2);ctx.lineTo(0,hy-hr-12);ctx.lineTo(3,hy-hr-2);ctx.fill();
} else {
ctx.fillStyle=hairC;
for(var bc=0;bc<5;bc++){var ba=bc/4*Math.PI+Math.PI;ctx.beginPath();ctx.arc(Math.cos(ba)*(hr+2),hy+Math.sin(ba)*(hr*.5),5,0,Math.PI*2);ctx.fill();}
}

// Yeux expressifs
var ey=bob-(c.isKid?50:54);
var ew=c.isKid?5:6,eh=c.isKid?6:7;
var eyeOpen=!(c.st===‘dance’&&Math.sin(T*.014)>.8);
var exc=c.isKid?0.75:1;
if(eyeOpen){
ctx.fillStyle=’#fff’;ctx.beginPath();ctx.ellipse(-exc*6,ey,ew,eh,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(exc*6,ey,ew,eh,0,0,Math.PI*2);ctx.fill();
var irisC=moodE===3?’#8e44ad’:moodE>=2?’#2980b9’:’#27ae60’;
ctx.fillStyle=irisC;ctx.beginPath();ctx.ellipse(-exc*6,ey+1,ew*.75,eh*.78,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(exc*6,ey+1,ew*.75,eh*.78,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle=’#1a1a2e’;ctx.beginPath();ctx.ellipse(-exc*5.5,ey+1,ew*.45,eh*.55,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(exc*6.5,ey+1,ew*.45,eh*.55,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle=‘rgba(255,255,255,.9)’;ctx.beginPath();ctx.arc(-exc*5,ey-1,1.4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(exc*7,ey-1,1.4,0,Math.PI*2);ctx.fill();
// Cils si féminin
if(c.sexe===‘F’){ctx.strokeStyle=’#2C3E50’;ctx.lineWidth=1.2;ctx.lineCap=‘round’;[-exc*10,-exc*6.5,-exc*3,exc*3,exc*6.5,exc*10].forEach(function(ex){var baseY=ey-(i<3?7:7);ctx.beginPath();ctx.moveTo(ex,ey-eh+1);ctx.lineTo(ex-1,ey-eh-3);ctx.stroke();});}
} else {
ctx.strokeStyle=’#2C3E50’;ctx.lineWidth=2.5;ctx.lineCap=‘round’;
ctx.beginPath();ctx.arc(-exc*6,ey,exc*4,.2,Math.PI-.2);ctx.stroke();
ctx.beginPath();ctx.arc(exc*6,ey,exc*4,.2,Math.PI-.2);ctx.stroke();
}
// Joues
ctx.fillStyle=‘rgba(255,140,140,.3)’;ctx.beginPath();ctx.ellipse(-exc*11,ey+6,exc*6,4,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(exc*11,ey+6,exc*6,4,0,0,Math.PI*2);ctx.fill();

// Bouche
ctx.lineCap=‘round’;ctx.lineJoin=‘round’;
var my=ey+10;
if(moodE===0){ctx.strokeStyle=’#C0392B’;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,my+2,5,.1,Math.PI-.1);ctx.stroke();}
else if(moodE===1){ctx.strokeStyle=’#C0392B’;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-4,my);ctx.lineTo(4,my);ctx.stroke();}
else if(moodE===2){ctx.strokeStyle=’#C0392B’;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,my-2,5,0,Math.PI);ctx.stroke();ctx.fillStyle=’#fff’;ctx.fillRect(-3,my-2,6,3);}
else{ctx.fillStyle=’#C0392B’;ctx.beginPath();ctx.arc(0,my-2,7,0,Math.PI);ctx.fill();ctx.fillStyle=’#fff’;ctx.fillRect(-5,my-2,10,4);ctx.fillStyle=’#E74C3C’;ctx.beginPath();ctx.ellipse(0,my+3,3.5,2.5,0,0,Math.PI*2);ctx.fill();}

// Accessoires mood
if(moodE===3&&!c.isKid){
ctx.fillStyle=’#C9943A’;ctx.fillRect(-10,hy-hr-4,20,7);
[[-8,hy-hr-4],[-1,hy-hr-9],[6,hy-hr-4],[13,hy-hr-4]].forEach(function(pt){ctx.beginPath();ctx.moveTo(pt[0],hy-hr-4);ctx.lineTo(pt[0]+4,pt[1]-5);ctx.lineTo(pt[0]+7,hy-hr-4);ctx.closePath();ctx.fill();});
ctx.fillStyle=’#E74C3C’;ctx.beginPath();ctx.arc(5,hy-hr-9,2.5,0,Math.PI*2);ctx.fill();
}
if(moodE===0){
ctx.fillStyle=‘rgba(120,140,180,.45)’;
ctx.beginPath();ctx.arc(8,hy-hr-12,6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(14,hy-hr-10,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(11,hy-hr-17,5.5,0,Math.PI*2);ctx.fill();
ctx.fillStyle=‘rgba(130,160,220,.5)’;ctx.font=‘8px sans-serif’;ctx.textAlign=‘center’;
[’•’,’•’,’•’].forEach(function(d,di){ctx.fillText(d,11+di*4,hy-hr-8+di*3);});
}
ctx.restore();

// Nom tag (petit, discret)
ctx.save();
ctx.fillStyle=‘rgba(0,0,0,.45)’;
ctx.beginPath();ctx.roundRect(p.x-18,p.y-76*sc-4,36,12,4);ctx.fill();
ctx.fillStyle=‘rgba(255,255,255,.85)’;ctx.font=‘bold 8px -apple-system,sans-serif’;ctx.textAlign=‘center’;
ctx.fillText(c.name,p.x,p.y-76*sc+5);
ctx.restore();
}

// ── MAIN LOOP ─────────────────────────────────────────
var LT=0;
function loop(now){
var dt=Math.min(now-LT,48);LT=now;
update(dt);drawBG();draw();
requestAnimationFrame(loop);
}

window.onload=function(){
loadData();
setTimeout(function(){
var l=document.getElementById(‘loading’);
l.style.opacity=‘0’;setTimeout(function(){l.style.display=‘none’;},420);
},1000);
document.getElementById(‘loading’).style.transition=‘opacity .42s’;
setInterval(loadData,30000);
requestAnimationFrame(loop);
};
</script>
